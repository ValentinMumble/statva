<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Statva's own skateboard: drawn for this app, free to reuse with it. -->
  <g transform="rotate(-24 256 256)">
    <!-- Trucks -->
    <rect x="128" y="270" width="64" height="22" rx="6" fill="#9aa0a6"/>
    <rect x="320" y="270" width="64" height="22" rx="6" fill="#9aa0a6"/>
    <!-- Wheels -->
    <circle cx="136" cy="300" r="26" fill="#f25c14"/>
    <circle cx="184" cy="300" r="26" fill="#f25c14"/>
    <circle cx="328" cy="300" r="26" fill="#f25c14"/>
    <circle cx="376" cy="300" r="26" fill="#f25c14"/>
    <circle cx="136" cy="300" r="9" fill="#ffcba8"/>
    <circle cx="184" cy="300" r="9" fill="#ffcba8"/>
    <circle cx="328" cy="300" r="9" fill="#ffcba8"/>
    <circle cx="376" cy="300" r="9" fill="#ffcba8"/>
    <!-- Deck: wood edge, then grip tape with its bolts -->
    <rect x="40" y="206" width="432" height="70" rx="35" fill="#b4733c"/>
    <rect x="44" y="200" width="424" height="62" rx="31" fill="#2b2b2f"/>
    <g fill="#8a8a90">
      <circle cx="146" cy="222" r="5"/><circle cx="174" cy="222" r="5"/>
      <circle cx="146" cy="242" r="5"/><circle cx="174" cy="242" r="5"/>
      <circle cx="338" cy="222" r="5"/><circle cx="366" cy="222" r="5"/>
      <circle cx="338" cy="242" r="5"/><circle cx="366" cy="242" r="5"/>
    </g>
  </g>
</svg>
